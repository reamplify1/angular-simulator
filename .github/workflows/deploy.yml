name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Сборка для GitHub Pages
        run: npm run build -- --base-href /angular-simulator/

      - name: Запасная страница для маршрутов
        run: cp dist/angular-simulator/browser/index.html dist/angular-simulator/browser/404.html

      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-simulator/browser

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
