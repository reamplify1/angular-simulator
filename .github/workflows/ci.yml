name: CI

on:
  push:
  pull_request:
    branches: [master, feature/homework-31]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверка кода (ESLint)
        run: npm run lint

      - name: Сборка проекта
        run: npm run build
