  <div class="post-detail-container">

    <button
      pButton
      type="button"
      icon="pi pi-arrow-left"
      class="p-button-outlined p-button-secondary back-button"
      (click)="goBack()"
    >
      {{ 'posts.details.back' | translate }}
    </button>

    <article class="post-card">

      <h1 class="post-title">{{ post.title }}</h1>

      <div class="post-meta">

        <div class="meta-item">
          <span class="meta-label">{{ 'posts.details.views' | translate }}</span>
          <span class="meta-value">{{ post.views }}</span>
        </div>

        <div class="meta-item">
          <span class="meta-label">👍 {{ 'posts.details.likes' | translate }}</span>
          <span class="meta-value">{{ post.reactions.likes }}</span>
        </div>

        <div class="meta-item">
          <span class="meta-label">👎 {{ 'posts.details.dislikes' | translate }}</span>
          <span class="meta-value">{{ post.reactions.dislikes }}</span>
        </div>

      </div>

      <p class="post-body">{{ post.body }}</p>

      <div class="tags">
        @for (tag of post.tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>

    </article>

  </div>
